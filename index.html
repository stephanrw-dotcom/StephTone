<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>StephToneV1.1</title>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <style>
    :root {
      --ink: #0d0d0f;
      --bg: #ffffff;
      --mute: #6b6b70;
      --red: #e63312;
      --fog: #efefea;
      --panel: #bfbfc1;
      --disp: #232325;
      --cy: #4fd6ee;
      --yl: #f4b92e;
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme=light]) {
        --ink: #f2f2ee;
        --bg: #0d0d0f;
        --mute: #9a9aa0;
        --fog: #1b1b1f;
        --panel: #2b2b2e;
        --disp: #151517;
      }
    }
    :root[data-theme=dark] {
      --ink: #f2f2ee;
      --bg: #0d0d0f;
      --mute: #9a9aa0;
      --fog: #1b1b1f;
      --panel: #2b2b2e;
      --disp: #151517;
    }
    html {
      height: 100%;
      scroll-padding-top: env(safe-area-inset-top, 0px);
    }
    body {
      margin: 0;
      height: 100%;
      font: 12px/1.4 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--ink);
    }
    * {
      border-radius: 0 !important;
      box-shadow: none !important;
    }
    [hidden] {
      display: none !important;
    }
    #app {
      display: grid;
      grid-template-columns: 340px 1fr;
      height: 100%;
    }
    aside {
      overflow-y: auto;
      border-right: 1px solid var(--ink);
      padding: 16px;
      background: var(--panel);
    }
    .bar {
      width: 40px;
      height: 6px;
      background: var(--red);
    }
    h1 {
      font: 800 24px 'Inter', 'Helvetica Neue', Helvetica, Arial, sans-serif;
      letter-spacing: -0.03em;
      margin: 6px 0 2px;
      border-bottom: 1px solid var(--ink);
      padding-bottom: 8px;
    }
    h3 {
      font: 600 10px 'Inter', Arial, sans-serif;
      letter-spacing: 0.14em;
      margin: 18px 0 8px;
      border-top: 1px solid var(--ink);
      padding-top: 6px;
    }
    .lab {
      font: 600 10px 'Inter', Arial, sans-serif;
      letter-spacing: 0.1em;
      margin: 8px 0 4px;
      color: var(--mute);
    }
    button, select {
      font: 600 10px 'Inter', Arial, sans-serif;
      letter-spacing: 0.08em;
      border: 1px solid var(--ink);
      background: transparent;
      color: var(--ink);
      padding: 7px 8px;
      cursor: pointer;
    }
    button.on {
      background: var(--yl);
      color: #1a1a1a;
      border-color: var(--yl);
    }
    select {
      width: 100%;
      margin: 3px 0;
    }
    .seg {
      display: flex;
      flex-wrap: wrap;
    }
    .seg button {
      flex: 1;
      margin: 0 -1px -1px 0;
    }
    .sw {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      align-items: center;
    }
    .sw i {
      width: 22px;
      height: 22px;
      border: 1px solid var(--ink);
      cursor: pointer;
    }
    .sw i.sel {
      outline: 2px solid var(--red);
      outline-offset: 1px;
    }
    .sw input {
      width: 30px;
      height: 24px;
      padding: 0;
      border: 1px solid var(--ink);
      background: none;
    }
    .disp {
      background: var(--disp);
      padding: 8px;
      margin: 4px 0;
    }
    .disp .lab {
      color: #9a9aa0;
    }
    .disp button {
      color: var(--yl);
      border-color: var(--yl);
    }
    .disp button.on {
      color: #1a1a1a;
    }
    .kg {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px 2px;
      margin: 6px 0;
    }
    .k {
      display: flex;
      flex-direction: column;
      align-items: center;
      user-select: none;
      touch-action: none;
      cursor: ns-resize;
    }
    .k b {
      font: 600 10.5px/1.1 'Inter', Arial, sans-serif;
      text-align: center;
      min-height: 24px;
      display: flex;
      align-items: flex-end;
      justify-content: center;
    }
    .k svg {
      width: 54px;
      height: 54px;
    }
    .k svg path {
      fill: none;
      stroke-linecap: round;
      stroke-width: 3.5;
    }
    .k .tr {
      stroke: var(--ink);
      opacity: 0.85;
    }
    .k .va {
      stroke: var(--cy);
    }
    .k .hd {
      stroke: var(--ink);
      stroke-width: 3;
      stroke-linecap: round;
    }
    .k em {
      font: 600 12px 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
      font-style: normal;
    }
    .k:hover em {
      color: var(--red);
    }
    .up {
      position: relative;
      display: block;
    }
    .up input {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }
    .up button {
      width: 100%;
      background: var(--ink);
      color: var(--bg);
    }
    main {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      min-height: 0;
      min-width: 0;
      background: var(--fog);
    }
    canvas {
      max-width: 100%;
      max-height: 100%;
      background: #ffffff;
    }
    #fs {
      position: absolute;
      top: 10px;
      right: 10px;
    }
    .clean aside {
      display: none;
    }
    .clean #app {
      grid-template-columns: 1fr;
    }
    @media (max-width: 800px) {
      html, body {
        height: auto;
      }
      #app {
        display: block;
        height: auto;
      }
      main {
        height: 60vh;
        box-sizing: border-box;
      }
      aside {
        border-right: 0;
      }
    }
    .brand{margin:-16px -16px 12px;padding:10px 16px;background:#080c0e;border-bottom:2px solid #1ee83a;display:flex;align-items:center;justify-content:space-between;gap:8px}
    .brand img{width:196px;height:auto;display:block}
    .ver{font:600 10px 'IBM Plex Mono',monospace;letter-spacing:.04em;color:#9aa6a8;text-align:right}
    #cl{display:none;position:absolute;left:12px;top:12px;z-index:2;background:#080c0e;padding:4px 10px}
    .clean #cl{display:block}#cl img{height:46px;width:auto;display:block}
  </style>
</head>

        ['angle', 'Screen Angle', 0, 180],
        ['szH', 'Highlights Size', 2, 40],
        ['szM', 'Mids Size', 2, 40],
        ['szS', 'Shadows Size', 2, 40],
        ['angH', 'Highlights Angle', 0, 180],
        ['angM', 'Mids Angle', 0, 180],
        ['angS', 'Shadows Angle', 0, 180],
        ['zmix', 'Zone Mix', 0, 100],
        ['amp', 'Wave Amplitude', 0, 40],
        ['wl', 'Wavelength', 10, 160],
        ['cx', 'Ring Centre X', 0, 100],
        ['cy', 'Ring Centre Y', 0, 100]
      ]],
      ['sec-tone', '02 / TONE', [

      ['sec-tex', '03 / TEXTURE', [

      ]],
      ['sec-plates', '04 / PLATES', [
        ['pv', 'CMYK Plate View', ['all', 'c', 'm', 'y', 'k']]
      ]],
      ['sec-pattern', '05 / PATTERN (THRESHOLD MAP)', [
        ['pmode', 'Pattern Mode', ['noise', 'serpentines', 'spirals', 'arcs']],

        ['pw', 'Width', 16, 160],
        ['ph', 'Height', 16, 160],
        ['pscale', 'Scale', 5, 200],
        ['feed', 'Mazes F', 20, 60],
        ['kill', 'Dots K', 50, 70],
        ['grow', 'Growing Time', 100, 1600],
        ['thick', 'Thickness', 20, 75],
        ['arms', 'Arms', 1, 12],
        ['wind', 'Winding', 0, 100],
        ['diam', 'Diameter', 10, 200],
        ['space', 'Spacing', 10, 200],
        ['sweep', 'Sweep', 1, 360]
      ]],
      ['sec-filters', '06 / IMAGE FILTERS', [
        ['gs', 'Grayscale Method', ['luminance', 'average', 'hd', 'red', 'green', 'blue', 'filter']],
        ['hue', 'Colour Filter Hue', 0, 360],
        ['iw', 'Image Width', 400, 2000],
        ['blur', 'Blur', 0, 20],
        ['sharp', 'Sharpen', 0, 100]
      ]]
    ];

    const U = {
      zmix: ' %', size: ' px', szH: ' px', szM: ' px', szS: ' px',
      angle: '°', angH: '°', angM: '°', angS: '°',
      amp: ' px', wl: ' px', cx: ' %', cy: ' %',
      contrast: ' %', hide: ' %', minM: ' %', maxM: ' %', spread: ' %',
      jit: ' %', noise: ' %', mis: ' px', pw: ' px', ph: ' px', iw: ' px',
      blur: ' px', sharp: ' %', hue: '°', sweep: '°', diam: ' px', space: ' px', wind: ' %'
    };

    const fmtv = (k, v) => {
      if (k === 'gamma') return (v / 100).toFixed(2);
      if (k === 'pscale') return (v / 10).toFixed(1) + '×';
      if (k === 'feed' || k === 'kill') return (v / 1000).toFixed(3);
      return (k === 'bright' && v > 0 ? '+' : '') + v + (U[k] || '');
    };

    const TG = {
      l1: 'WHITE DOTS',
      l2: 'PATTERN',
      l3: 'BLACK DOTS',
      pinv: 'INVERT',
      pflip: 'FLIP',
      prand: 'RANDOM'
    };

    // Build modular parameter UI
    $('#ui').innerHTML = SL.map(([secId, title, items]) => {
      const segs = items.filter(x => Array.isArray(x[2]));
      const knobs = items.filter(x => !Array.isArray(x[2]));
      const isPat = secId === 'sec-pattern';

      const dispHtml = (segs.length || isPat)
        ? `<div class="disp">` +
          segs.map(([k, lbl, opts]) => {
            const btns = opts.map(opt => {
              const label = Array.isArray(opt) ? opt[0] : opt;
              const val = Array.isArray(opt) ? opt[1] : opt;
              return `<button type="button" data-sk="${k}" data-v="${val}">${label}</button>`;
            }).join('');
            return `<div data-ctrl="${k}"><div class="lab">${lbl.toUpperCase()}</div><div class="seg">${btns}</div></div>`;
          }).join('') +
          (isPat
            ? `<div data-ctrl="ptg"><div class="lab">LAYERS / OPTIONS</div><div class="seg">${Object.keys(TG).map(k => `<button type="button" data-tg="${k}">${TG[k]}</button>`).join('')}</div></div>`
            : '') +
          `</div>`
        : '';

      const knobHtml = `<div class="kg">${knobs.map(([k, lbl, mn, mx]) =>
        `<div class="k" data-ctrl="${k}" data-kn="${k}" data-min="${mn}" data-max="${mx}"><b>${lbl}</b><svg viewBox="0 0 54 54"><path class="tr"/><path class="va"/><line class="hd"/></svg><em></em></div>`
      ).join('')}</div>`;

      return `<div data-sec="${secId}"><h3>${title}</h3>${dispHtml}${knobHtml}</div>`;
    }).join('');

    // Rotary SVG knob geometry helpers
    const pt = (a, r) => [27 + r * Math.sin(a * RAD), 27 - r * Math.cos(a * RAD)];
    const arc = (a0, a1) => {
      if (Math.abs(a1 - a0) < 0.5) return '';
      const p = pt(a0, 21);
      const q = pt(a1, 21);
      return `M${p[0]} ${p[1]}A21 21 0 ${Math.abs(a1 - a0) > 180 ? 1 : 0} ${a1 > a0 ? 1 : 0} ${q[0]} ${q[1]}`;
    };

    function kdraw(el) {
      const k = el.dataset.kn;
      const mn = +el.dataset.min;
      const mx = +el.dataset.max;
      const a = -135 + 270 * (S[k] - mn) / (mx - mn);
      const a0 = mn < 0 ? -135 + 270 * (-mn) / (mx - mn) : -135;
      const p = pt(a, 6);
      const q = pt(a, 17);
      const h = el.querySelector('.hd');
      el.querySelector('.tr').setAttribute('d', arc(-135, 135));
      el.querySelector('.va').setAttribute('d', arc(Math.min(a0, a), Math.max(a0, a)));
      h.setAttribute('x1', p[0]);
      h.setAttribute('y1', p[1]);
      h.setAttribute('x2', q[0]);
      h.setAttribute('y2', q[1]);
      el.querySelector('em').textContent = fmtv(k, S[k]);
    }

    // Colour & plate UI
    const INKS = [
      ['Ink', '#0d0d0f'],
      ['Vermilion', '#e63312'],
      ['Cobalt', '#1f3fbf'],
      ['Emerald', '#00875a'],
      ['Citrine', '#e8b900'],
      ['Fluoro Pink', '#ff48b0'],
      ['Violet', '#4b2a8c'],
      ['Umber', '#6b4a32']
    ];
    const PAP = ['#ffffff', '#efefea', '#e3dccb', '#0d0d0f'];

    function colUI() {
      const n = { mono: 1, duo: 2, cmyk: 0 }[S.mode];
      let h = '<div class="seg">' + ['mono', 'duo', 'cmyk'].map(m =>
        `<button type="button" data-mode="${m}" class="${S.mode === m ? 'on' : ''}">${m.toUpperCase()}</button>`
      ).join('') + '</div>';

      if (!n) {
        h += '<div class="lab">PROCESS INKS: CYAN / MAGENTA / YELLOW / BLACK</div>';
      }
      for (let i = 0; i < n; i++) {
        h += `<div class="lab">INK 0${i + 1}</div><div class="sw">` +
          INKS.map(x => `<i title="${x[0]}" data-ink="${i}" data-c="${x[1]}" style="background:${x[1]}" class="${S.inks[i] === x[1] ? 'sel' : ''}"></i>`).join('') +
          `<input type="color" data-ic="${i}" value="${S.inks[i]}"></div>`;
      }
      h += '<div class="lab">PAPER</div><div class="sw">' +
        PAP.map(x => `<i data-pap="${x}" style="background:${x}" class="${S.paper === x ? 'sel' : ''}"></i>`).join('') +
        `<input type="color" data-pc value="${S.paper}"></div>` +
        (n ? '<div style="margin-top:6px"><button id="swap" type="button">SWAP INK / PAPER</button></div>' : '');

      $('#col').innerHTML = h;
    }

    // Context-aware visibility: hide parameters that do nothing in current screen/mode
    function vis() {
      const activeScreens = S.zsplit ? [S.scH, S.scM, S.scS] : [S.screen];
      const hasDots = activeScreens.some(sc => sc === 'dots-grid' || sc === 'dots-hex' || sc === 'stochastic');
      const hasNonPat = activeScreens.some(sc => sc !== 'pattern');
      const onlyRings = activeScreens.every(sc => sc === 'rings');
      const hasWavy = activeScreens.includes('wavy');
      const hasRings = activeScreens.includes('rings');
      const hasPattern = activeScreens.includes('pattern');
      const hasJit = activeScreens.some(sc => ['dots-grid', 'dots-hex', 'lines', 'wavy', 'crosshatch', 'stochastic'].includes(sc));
      const hasNoise = activeScreens.some(sc => sc !== 'stochastic');
      const hasMinMax = activeScreens.some(sc => sc !== 'stochastic');

      const isSerp = hasPattern && S.pmode === 'serpentines';
      const isSpir = hasPattern && S.pmode === 'spirals';
      const isArcs = hasPattern && S.pmode === 'arcs';
      const isGeom = isSpir || isArcs;

      const show = {
        zsplit: true,
        screen: !S.zsplit,
        scH: S.zsplit,
        scM: S.zsplit,
        scS: S.zsplit,
        zmix: S.zsplit,
        shape: hasDots,
        size: !S.zsplit && hasNonPat,
        angle: !S.zsplit && !onlyRings,
        szH: S.zsplit && S.scH !== 'pattern',
        szM: S.zsplit && S.scM !== 'pattern',
        szS: S.zsplit && S.scS !== 'pattern',
        angH: S.zsplit && S.scH !== 'rings',
        angM: S.zsplit && S.scM !== 'rings',
        angS: S.zsplit && S.scS !== 'rings',
        amp: hasWavy,
        wl: hasWavy,
        cx: hasRings,
        cy: hasRings,

        contrast: true,
        bright: true,
        gamma: true,
        hide: true,
        minM: hasMinMax,
        maxM: hasMinMax,
        spread: true,

        jit: hasJit,
        noise: hasNoise,
        mis: S.mode !== 'mono' && !(S.mode === 'cmyk' && S.pv !== 'all'),
        seed: true,

        pv: S.mode === 'cmyk',

        pmode: hasPattern,
        prot: hasPattern,
        pw: hasPattern,
        ph: hasPattern,
        pscale: hasPattern,
        feed: isSerp,
        kill: isSerp,
        grow: isSerp,
        thick: isSerp,
        arms: isSpir,
        wind: isSpir,
        diam: isGeom,
        space: isGeom,
        sweep: isArcs,
        ptg: hasPattern,

        gs: true,
        hue: S.gs === 'filter',
        iw: true,
        blur: true,
        sharp: true
      };

      document.querySelectorAll('[data-ctrl]').forEach(el => {
        el.hidden = !show[el.dataset.ctrl];
      });

      const secMap = {
        'sec-plates': S.mode === 'cmyk',
        'sec-pattern': hasPattern
      };
      Object.entries(secMap).forEach(([id, on]) => {
        const sec = document.querySelector(`[data-sec="${id}"]`);
        if (sec) sec.hidden = !on;
      });

      const prandBtn = document.querySelector('[data-tg="prand"]');
      if (prandBtn) prandBtn.hidden = !isGeom;

      const hasUserPresets = Object.keys(UP).length > 0;
      $('#uprelab').hidden = !hasUserPresets;
      $('#upre').hidden = !hasUserPresets;
    }

    let actPre = null;
    const clrPre = () => {
      actPre = null;
      document.querySelectorAll('#pre button, #upre button').forEach(b => b.classList.remove('on'));
    };

    $('#col').onclick = e => {
      const t = e.target;
      if (t.dataset.mode) S.mode = t.dataset.mode;
      else if (t.dataset.ink) S.inks[+t.dataset.ink] = t.dataset.c;
      else if (t.dataset.pap) S.paper = t.dataset.pap;
      else if (t.id === 'swap') [S.inks[0], S.paper] = [S.paper, S.inks[0]];
      else return;
      clrPre();
      colUI();
      vis();
      go();
    };

    $('#col').oninput = e => {
      const t = e.target;
      if (t.dataset.ic) S.inks[+t.dataset.ic] = t.value;
      else if ('pc' in t.dataset) S.paper = t.value;
      else return;
      clrPre();
      go();
    };

    const chg = k => {
      clrPre();
      if (k === 'iw' || k === 'blur' || k === 'sharp') prep();
      go();
    };

    let KD = null;
    $('#ui').onclick = e => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.sk) {
        const raw = b.dataset.v;
        S[b.dataset.sk] = raw === 'true' ? true : raw === 'false' ? false : (isNaN(raw) ? raw : +raw);
      } else if (b.dataset.tg) {
        S[b.dataset.tg] = !S[b.dataset.tg];
      } else {
        return;
      }
      clrPre();
      sync();
      go();
    };

    $('#ui').onpointerdown = e => {
      const el = e.target.closest('.k');
      if (!el) return;
      el.setPointerCapture(e.pointerId);
      KD = { el, y: e.clientY, v: S[el.dataset.kn] };
    };

    $('#ui').onpointermove = e => {
      if (!KD) return;
      const el = KD.el;
      const k = el.dataset.kn;
      const mn = +el.dataset.min;
      const mx = +el.dataset.max;
      S[k] = Math.round(Math.min(mx, Math.max(mn, KD.v + (KD.y - e.clientY) * (mx - mn) / (e.shiftKey ? 900 : 160))));
      kdraw(el);
      chg(k);
    };

    $('#ui').onpointerup = () => { KD = null; };

    $('#ui').ondblclick = e => {
      const el = e.target.closest('.k');
      if (el) {
        const k = el.dataset.kn;
        S[k] = DEF[k];
        kdraw(el);
        chg(k);
      }
    };

    $('#ui').onwheel = e => {
      const el = e.target.closest('.k');
      if (!el) return;
      e.preventDefault();
      const k = el.dataset.kn;
      const mn = +el.dataset.min;
      const mx = +el.dataset.max;
      S[k] = Math.min(mx, Math.max(mn, S[k] + (e.deltaY < 0 ? 1 : -1) * Math.max(1, Math.round((mx - mn) / 100))));
      kdraw(el);
      chg(k);
    };

    function sync() {
      document.querySelectorAll('.k').forEach(kdraw);
      document.querySelectorAll('[data-sk]').forEach(b => {
        b.classList.toggle('on', String(S[b.dataset.sk]) === b.dataset.v);
      });
      document.querySelectorAll('[data-tg]').forEach(b => {
        b.classList.toggle('on', !!S[b.dataset.tg]);
      });
      $('#inv').classList.toggle('on', S.inv);
      $('#flp').classList.toggle('on', S.flip);
      document.querySelectorAll('#pre button').forEach(b => {
        b.classList.toggle('on', actPre === 'p:' + b.textContent);
      });
      document.querySelectorAll('#upre button[data-u]').forEach(b => {
        b.classList.toggle('on', actPre === 'u:' + b.dataset.u);
      });
      colUI();
      vis();
    }

    // Built-in & user presets
    const PR = {
      'NEWSPRINT': { screen: 'dots-hex', size: 7, angle: 45, contrast: 150, spread: 30, noise: 15, paper: '#e3dccb', inks: ['#1a1a1a', '#e63312'] },
      'FINE LINE': { screen: 'lines', size: 5, angle: 20, contrast: 150, hide: 4 },
      'POP CMYK': { screen: 'dots-grid', size: 9, angle: 45, mode: 'cmyk', mis: 2, contrast: 130 },
      'RISO DUO': { screen: 'dots-grid', size: 8, angle: 30, mode: 'duo', inks: ['#1f3fbf', '#ff48b0'], paper: '#efefea', mis: 3, noise: 30, contrast: 150 },
      'STOCHASTIC': { screen: 'stochastic', size: 3, contrast: 160, hide: 3 },
      'VINYL RINGS': { screen: 'rings', size: 6, contrast: 150 },
      'WAVE LINES': { screen: 'wavy', size: 7, amp: 6, wl: 55, angle: 0, contrast: 140 },
      'ENGRAVING': { screen: 'crosshatch', size: 5, angle: 45, contrast: 170, hide: 4 },
      'DIAMOND POSTER': { screen: 'dots-grid', shape: 'diamond', size: 14, angle: 45, mode: 'duo', inks: ['#0d0d0f', '#e63312'], paper: '#efefea', mis: 2 },
      'RING DOTS': { screen: 'dots-hex', shape: 'ring', size: 12, angle: 15, contrast: 130, minM: 10 },
      'SERPENTINES': { screen: 'pattern', pmode: 'serpentines', pw: 72, ph: 72, grow: 900, pscale: 20, contrast: 150, hide: 3 },
      'SPIRAL FIELD': { screen: 'pattern', pmode: 'spirals', pw: 128, ph: 128, pscale: 20, arms: 3, wind: 50, diam: 70, space: 60, contrast: 150 },
      'ARC FANS': { screen: 'pattern', pmode: 'arcs', pw: 128, ph: 128, pscale: 30, diam: 60, space: 40, sweep: 160, contrast: 150 },
      'NOISE GRAIN': { screen: 'pattern', pmode: 'noise', pw: 128, ph: 128, pscale: 10, contrast: 150 },
      'TRIPLE ZONE': { zsplit: true, scH: 'dots-grid', scM: 'lines', scS: 'crosshatch', szH: 6, szM: 8, szS: 10, angH: 15, angM: 45, angS: 75, zmix: 45, contrast: 150 },
      'WAVE + DOTS': { zsplit: true, scH: 'dots-hex', scM: 'wavy', scS: 'rings', szH: 5, szM: 8, szS: 11, angH: 30, angM: 0, angS: 45, zmix: 55, amp: 6, wl: 48, contrast: 145 },
      'RISO ZONES': { zsplit: true, scH: 'stochastic', scM: 'dots-grid', scS: 'lines', szH: 4, szM: 8, szS: 10, angH: 15, angM: 45, angS: 135, zmix: 50, mode: 'duo', inks: ['#1f3fbf', '#e63312'], paper: '#efefea', mis: 2, contrast: 150 }
    };

    let UP = {};
    try { UP = JSON.parse(localStorage.getItem('st.up') || '{}'); } catch (e) {}
    const stU = () => { try { localStorage.setItem('st.up', JSON.stringify(UP)); } catch (e) {} };

    function upl() {
      $('#upre').innerHTML = Object.keys(UP).map(k =>
        `<button type="button" data-u="${k}">${k}</button><button type="button" data-d="${k}" style="flex:0 0 28px">×</button>`
      ).join('');
    }

    $('#upre').onclick = e => {
      const u = e.target.dataset.u;
      const d = e.target.dataset.d;
      if (u && UP[u]) {
        const up = UP[u];
        Object.assign(S, DEF, up, { inks: up.inks.slice() });
        if (up.zsplit) {
          if (up.szH == null) S.szH = S.size;
          if (up.szM == null) S.szM = S.size;
          if (up.szS == null) S.szS = S.size;
          if (up.angH == null) S.angH = S.angle;
          if (up.angM == null) S.angM = S.angle;
          if (up.angS == null) S.angS = S.angle;
        }
        actPre = 'u:' + u;
        prep();
        sync();
        go();
      } else if (d) {
        delete UP[d];
        if (actPre === 'u:' + d) actPre = null;
        stU();
        upl();
        vis();
      }
    };

    $('#psv').onclick = () => {
      const n = $('#pn').value.trim().slice(0, 24).replace(/[<>"]/g, '');
      if (!n) return;
      UP[n] = JSON.parse(JSON.stringify(S));
      actPre = 'u:' + n;
      stU();
      upl();
      sync();
    };
    upl();

    $('#pre').innerHTML = Object.keys(PR).map(k => `<button type="button">${k}</button>`).join('');
    $('#pre').onclick = e => {
      const name = e.target.textContent;
      const p = PR[name];
      if (!p) return;
      Object.assign(S, DEF, p, { inks: (p.inks || DEF.inks).slice() });
      S.inv = false;
      S.flip = false;
      S.r90 = 0;
      actPre = 'p:' + name;
      if (SRC && SRC.sample) {
        if (p.mode === 'cmyk' && !SRC.isCol) sample(1);
        else if (p.mode !== 'cmyk' && SRC.isCol) sample(0);
      }
      prep();
      sync();
      go();
    };

    // Image preparation & built-in samples
    let W = 1000, H = 1200, D_ = null, SRC = null, OF = [[0, 0]];

    function prep() {
      if (!SRC) return;
      const r = S.r90 % 2;
      const iw = r ? SRC.h : SRC.w;
      const ih = r ? SRC.w : SRC.h;
      const k = S.iw / Math.max(iw, ih);
      W = Math.round(iw * k);
      H = Math.round(ih * k);

      const c = document.createElement('canvas');
      c.width = W;
      c.height = H;
      const x = c.getContext('2d', { willReadFrequently: true });
      x.translate(W / 2, H / 2);
      if (S.flip) x.scale(-1, 1);
      x.rotate(S.r90 * Math.PI / 2);
      x.drawImage(SRC.el, -SRC.w * k / 2, -SRC.h * k / 2, SRC.w * k, SRC.h * k);

      const id = x.getImageData(0, 0, W, H);
      D_ = id.data;
      if (S.blur > 0) D_ = bl(c, S.blur);
      if (S.sharp > 0) {
        const B = bl(c, 2);
        const q = S.sharp / 50;
        for (let i = 0; i < D_.length; i++) {
          if (i % 4 < 3) D_[i] = Math.min(255, Math.max(0, D_[i] + q * (D_[i] - B[i])));
        }
      }
      if (S.inv) {
        for (let i = 0; i < D_.length; i++) {
          if (i % 4 < 3) D_[i] = 255 - D_[i];
        }
      }
    }

    function bl(src, r) {
      const f = Math.max(0.04, 1 / (1 + r));
      const t = document.createElement('canvas');
      t.width = Math.max(2, (W * f) | 0);
      t.height = Math.max(2, (H * f) | 0);
      const q = t.getContext('2d');
      q.imageSmoothingQuality = 'high';
      q.drawImage(src, 0, 0, t.width, t.height);
      const o = document.createElement('canvas');
      o.width = W;
      o.height = H;
      const z = o.getContext('2d', { willReadFrequently: true });
      z.imageSmoothingQuality = 'high';
      z.drawImage(t, 0, 0, W, H);
      return z.getImageData(0, 0, W, H).data;
    }

    function sample(col) {
      const c = document.createElement('canvas');
      c.width = 900;
      c.height = 1100;
      const x = c.getContext('2d');
      let g = x.createLinearGradient(0, 0, 900, 1100);
      if (col) {
        g.addColorStop(0, '#00aeef');
        g.addColorStop(0.5, '#ec008c');
        g.addColorStop(1, '#fff200');
        x.fillStyle = g;
        x.fillRect(0, 0, 900, 1100);
        g = x.createRadialGradient(360, 420, 40, 450, 550, 360);
        g.addColorStop(0, '#ffffff');
        g.addColorStop(0.55, '#c9a0d8');
        g.addColorStop(1, '#241040');
        x.fillStyle = g;
        x.beginPath();
        x.arc(450, 560, 340, 0, TAU);
        x.fill();
        x.fillStyle = 'rgba(20,10,40,0.55)';
        x.beginPath();
        x.ellipse(470, 1010, 300, 50, 0, 0, TAU);
        x.fill();
        x.fillStyle = '#fff200';
        x.beginPath();
        x.arc(700, 230, 70, 0, TAU);
        x.fill();
      } else {
        g.addColorStop(0, '#aaaaaa');
        g.addColorStop(1, '#f4f4f4');
        x.fillStyle = g;
        x.fillRect(0, 0, 900, 1100);
        x.fillStyle = '#1a1a1a';
        x.beginPath();
        x.ellipse(450, 1130, 430, 330, 0, 0, TAU);
        x.fill();
        x.fillStyle = '#6a6a6a';
        x.fillRect(380, 640, 140, 200);
        x.fillStyle = '#111111';
        x.beginPath();
        x.ellipse(450, 340, 225, 240, 0, 0, TAU);
        x.fill();
        g = x.createRadialGradient(390, 430, 20, 450, 480, 300);
        g.addColorStop(0, '#fafafa');
        g.addColorStop(0.6, '#9c9c9c');
        g.addColorStop(1, '#2e2e2e');
        x.fillStyle = g;
        x.beginPath();
        x.ellipse(450, 490, 185, 245, 0, 0, TAU);
        x.fill();
        x.fillStyle = '#111111';
        x.beginPath();
        x.ellipse(430, 300, 190, 75, -0.1, 0, TAU);
        x.fill();
        x.beginPath();
        x.ellipse(385, 475, 26, 10, 0, 0, TAU);
        x.ellipse(515, 475, 26, 10, 0, 0, TAU);
        x.fill();
        x.fillRect(350, 432, 70, 8);
        x.fillRect(480, 432, 70, 8);
        x.fillStyle = '#444444';
        x.beginPath();
        x.ellipse(450, 640, 48, 12, 0, 0, TAU);
        x.fill();
      }
      SRC = { el: c, w: 900, h: 1100, sample: 1, isCol: !!col };
    }

    function loadFile(f) {
      if (!f || !f.type.startsWith('image/')) return;
      const im = new Image();
      im.src = URL.createObjectURL(f);
      im.decode().then(() => {
        SRC = { el: im, w: im.naturalWidth, h: im.naturalHeight };
        $('#msg').textContent = '';
        prep();
        go();
      }).catch(() => {
        $('#msg').textContent = 'Could not read that image.';
      });
    }

    $('#file').onchange = e => { loadFile(e.target.files[0]); e.target.value = ''; };
    addEventListener('dragover', e => e.preventDefault());
    addEventListener('drop', e => { e.preventDefault(); loadFile(e.dataTransfer.files[0]); });
    addEventListener('paste', e => {
      for (const i of e.clipboardData.items) {
        if (i.type.startsWith('image/')) loadFile(i.getAsFile());
      }
    });

    $('#smp').onclick = () => { clrPre(); sample(0); prep(); sync(); go(); };
    $('#smc').onclick = () => { clrPre(); sample(1); prep(); sync(); go(); };
    $('#inv').onclick = () => { clrPre(); S.inv = !S.inv; sync(); prep(); go(); };
    $('#flp').onclick = () => { clrPre(); S.flip = !S.flip; sync(); prep(); go(); };
    $('#r90').onclick = () => { clrPre(); S.r90 = (S.r90 + 1) % 4; prep(); go(); };

    const fs = () => document.body.classList.toggle('clean');
    $('#fs').onclick = fs;
    addEventListener('keydown', e => {
      if ((e.key === 'f' || e.key === 'F') && !/INPUT|SELECT/.test(e.target.tagName)) fs();
    });

    // Halftone & threshold screening engine
    function rng(a) {
      return () => {
        a |= 0;
        a = (a + 0x6D2B79F5) | 0;
        let t = Math.imul(a ^ (a >>> 15), 1 | a);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    let R_, G_, B_, GW = [0.299, 0.587, 0.114];
    const hw = h => {
      h /= 360;
      const c = a => Math.min(1, Math.max(0, a));
      const r = c(Math.abs(h * 6 - 3) - 1);
      const g = c(2 - Math.abs(h * 6 - 2));
      const b = c(2 - Math.abs(h * 6 - 4));
      const s = r + g + b || 1;
      return [r / s, g / s, b / s];
    };

    function gw() {
      const g = S.gs;
      GW = g === 'average' ? [0.333, 0.333, 0.334]
        : g === 'hd' ? [0.2126, 0.7152, 0.0722]
        : g === 'red' ? [1, 0, 0]
        : g === 'green' ? [0, 1, 0]
        : g === 'blue' ? [0, 0, 1]
        : g === 'filter' ? hw(S.hue)
        : [0.299, 0.587, 0.114];
    }

    function smp(x, y) {
      let r = 0, g = 0, b = 0;
      for (const o of OF) {
        let X = (x + o[0]) | 0;
        let Y = (y + o[1]) | 0;
        X = X < 0 ? 0 : X >= W ? W - 1 : X;
        Y = Y < 0 ? 0 : Y >= H ? H - 1 : Y;
        const i = (Y * W + X) * 4;
        r += D_[i];
        g += D_[i + 1];
        b += D_[i + 2];
      }
      const n = OF.length * 255;
      R_ = r / n;
      G_ = g / n;
      B_ = b / n;
    }

    const adj = d => {
      d = (d - 0.5) * S.contrast / 100 + 0.5 + S.bright / 100;
      d = d < 0 ? 0 : d > 1 ? 1 : d;
      return Math.pow(d, 100 / S.gamma);
    };

    const DD = (p, x, y) => {
      smp(x, y);
      return adj(p.t(R_, G_, B_));
    };

    const fz = d => S.minM / 100 + (S.maxM - S.minM) / 100 * d;
    const lm = (r, g, b) => 1 - (GW[0] * r + GW[1] * g + GW[2] * b);

    // Smooth partition-of-unity tonal weights for Highlights, Mids, and Shadows
    function zoneWeights(d) {
      const m = S.zmix / 100;
      if (m <= 0.001) {
        if (d < 1 / 3) return [1, 0, 0];
        if (d < 2 / 3) return [0, 1, 0];
        return [0, 0, 1];
      }
      const hw = (1 / 3) * m;
      const ss = (e0, e1, x) => {
        const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0)));
        return t * t * (3 - 2 * t);
      };
      const t1 = ss(1 / 3 - hw, 1 / 3 + hw, d);
      const t2 = ss(2 / 3 - hw, 2 / 3 + hw, d);
      return [1 - t1, Math.max(0, t1 - t2), t2];
    }

    function plates() {
      const m = S.mode;
      if (m === 'mono') return [{ c: S.inks[0], da: 0, t: lm }];
      if (m === 'duo') {
        return [
          { c: S.inks[0], da: 0, t: (r, g, b) => Math.pow(lm(r, g, b), 1.5) },
          { c: S.inks[1], da: 30, t: (r, g, b) => Math.pow(lm(r, g, b), 0.7) * 0.85 }
        ];
      }
      const k = (r, g, b) => 1 - Math.max(r, g, b);
      const f = q => (r, g, b) => {
        const K = k(r, g, b);
        return K > 0.999 ? 0 : (1 - [r, g, b][q] - K) / (1 - K);
      };
      return [
        ['#00aeef', -30, f(0)],
        ['#ec008c', 30, f(1)],
        ['#fff200', -45, f(2)],
        ['#231f20', 0, k]
      ].map(([c, da, t]) => ({ c, da, t }));
    }

    function rect(T, x, y, hx, hy, a) {
      const c = Math.cos(a);
      const s = Math.sin(a);
      T.poly([[-hx, -hy], [hx, -hy], [hx, hy], [-hx, hy]].map(([u, v]) => [x + u * c - v * s, y + u * s + v * c]));
    }

    function shape(T, x, y, s, f, a) {
      const q = Math.sqrt(Math.max(0, f));
      const sh = S.shape;
      if (sh === 'circle') {
        T.circ(x, y, s * 0.5 * q * 1.25);
      } else if (sh === 'ring') {
        T.circ(x, y, s * 0.5 * q * 1.3);
        T.circ(x, y, s * 0.5 * q * 0.7, 1);
      } else if (sh === 'cross') {
        const L = s * 0.5 * q * 1.5;
        const t = L * 0.35;
        rect(T, x, y, L, t, a);
        rect(T, x, y, t, L, a);
      } else {
        const h = s * 0.5 * q * (sh === 'diamond' ? 1.45 : 1.1);
        rect(T, x, y, h, h, a + (sh === 'diamond' ? 0.7854 : 0));
      }
    }

    function dots(T, p, r, hex, zw) {
      const s = p.s;
      const a = p.a * RAD;
      const ca = Math.cos(a);
      const sa = Math.sin(a);
      const R = Math.hypot(W, H) / 2 + s;
      const rs = hex ? s * 0.866 : s;
      const j = S.jit / 100 * s * 0.5;

      for (let v = -R, row = 0; v <= R; v += rs, row++) {
        const off = hex && (row % 2) ? s / 2 : 0;
        for (let u = -R + off; u <= R; u += s) {
          const x = W / 2 + u * ca - v * sa + (r() - 0.5) * j;
          const y = H / 2 + u * sa + v * ca + (r() - 0.5) * j;
          if (x < -s || x > W + s || y < -s || y > H + s) continue;
          const d = DD(p, x, y);
          if (d < S.hide / 100) continue;
          const w = zw ? zw(d) : 1;
          if (w <= 0.005) continue;
          const f = fz(d) * w * (1 + (r() - 0.5) * S.noise / 100 * 0.6);
          if (f > 0.01) shape(T, x + p.ox, y + p.oy, s, f, a);
        }
      }
    }

    function lines(T, p, r, ang, gate, wave, zw) {
      const s = p.s;
      const a = ang * RAD;
      const ca = Math.cos(a);
      const sa = Math.sin(a);
      const R = Math.hypot(W, H) / 2 + s;
      const st = Math.max(1.5, s * 0.5);

      for (let v = -R; v <= R; v += s) {
        let tp = [];
        let bt = [];
        const jv = (r() - 0.5) * S.jit / 100 * s * 0.5;
        const fl = () => {
          if (tp.length > 1) T.poly(tp.concat(bt.reverse()));
          tp = [];
          bt = [];
        };

        for (let u = -R; u <= R; u += st) {
          const vv = v + jv + (wave ? Math.sin(u / S.wl * TAU + v * 0.07) * S.amp : 0);
          const x = W / 2 + u * ca - vv * sa;
          const y = H / 2 + u * sa + vv * ca;
          if (x < -s || x > W + s || y < -s || y > H + s) { fl(); continue; }
          const rawD = DD(p, x, y);
          const d = gate(rawD);
          if (d < S.hide / 100) { fl(); continue; }
          const w = zw ? zw(rawD) : 1;
          if (w <= 0.005) { fl(); continue; }
          const h = Math.max(0.2, fz(d) * w * s * 0.5 * (1 + (r() - 0.5) * S.noise / 100 * 0.6));
          tp.push([x - sa * h + p.ox, y + ca * h + p.oy]);
          bt.push([x + sa * h + p.ox, y - ca * h + p.oy]);
        }
        fl();
      }
    }

    function rings(T, p, r, zw) {
      const s = p.s;
      const cx = W * S.cx / 100;
      const cy = H * S.cy / 100;
      const Rm = Math.hypot(Math.max(cx, W - cx), Math.max(cy, H - cy)) + s;

      for (let rho = s; rho <= Rm; rho += s) {
        const n = Math.max(16, Math.ceil(TAU * rho / (s * 0.5)));
        let tp = [];
        let bt = [];
        let full = true;
        const fl = () => {
          if (tp.length > 1) T.poly(tp.concat(bt.reverse()));
          tp = [];
          bt = [];
        };

        for (let i = 0; i < n; i++) {
          const t = i / n * TAU;
          const c = Math.cos(t);
          const sn = Math.sin(t);
          const x = cx + rho * c;
          const y = cy + rho * sn;
          if (x < -s || x > W + s || y < -s || y > H + s) { full = false; fl(); continue; }
          const d = DD(p, x, y);
          if (d < S.hide / 100) { full = false; fl(); continue; }
          const w = zw ? zw(d) : 1;
          if (w <= 0.005) { full = false; fl(); continue; }
          const h = Math.max(0.2, fz(d) * w * s * 0.5 * (1 + (r() - 0.5) * S.noise / 100 * 0.6));
          tp.push([x + c * h + p.ox, y + sn * h + p.oy]);
          bt.push([x - c * h + p.ox, y - sn * h + p.oy]);
        }
        if (full && tp.length > 2) {
          T.poly(tp);
          T.poly(bt.reverse());
        } else {
          fl();
        }
      }
    }

    function fm(T, p, r, zw) {
      const s = p.s;
      const j = S.jit / 100 * s * 0.8;
      const a = p.a * RAD;
      for (let y = 0; y < H; y += s) {
        for (let x = 0; x < W; x += s) {
          const X = x + s * 0.5 + (r() - 0.5) * (s + j);
          const Y = y + s * 0.5 + (r() - 0.5) * (s + j);
          const d = DD(p, X, Y);
          if (d < S.hide / 100) continue;
          const w = zw ? zw(d) : 1;
          if (w <= 0.005 || r() > d * w) continue;
          shape(T, X + p.ox, Y + p.oy, s, 0.55, a);
        }
      }
    }

    // Tileable pattern threshold map generator
    let PM = null, PKY = '';
    function pat() {
      const k = [S.pmode, S.pw, S.ph, S.feed, S.kill, S.grow, S.thick, S.arms, S.wind, S.diam, S.space, S.sweep, S.seed, S.prand] + '';
      if (k === PKY) return PM;
      PKY = k;
      const w = S.pw;
      const h = S.ph;
      const n = w * h;
      const r = rng(S.seed * 7 + 3);
      const f = new Float32Array(n);

      if (S.pmode === 'noise') {
        for (let i = 0; i < n; i++) f[i] = r();
      } else if (S.pmode === 'serpentines') {
        let A = new Float32Array(n).fill(1);
        let V = new Float32Array(n);
        let A2 = new Float32Array(n);
        let V2 = new Float32Array(n);
        for (let i = 0; i < n; i++) {
          if (r() < 0.04) { V[i] = 0.5; A[i] = 0.5; }
        }
        const F = S.feed / 1000;
        const K = S.kill / 1000;
        const du = 0.16 * S.thick / 50;
        const dv = 0.08 * S.thick / 50;
        const steps = Math.min(S.grow, Math.floor(6500000 / Math.max(1, n)));
        for (let t = 0; t < steps; t++) {
          for (let y = 0; y < h; y++) {
            const a = ((y + h - 1) % h) * w;
            const b = y * w;
            const c = ((y + 1) % h) * w;
            for (let x = 0; x < w; x++) {
              const xm = (x + w - 1) % w;
              const xp = (x + 1) % w;
              const i = b + x;
              const u = A[i];
              const v = V[i];
              const q = u * v * v;
              A2[i] = u + du * (A[a + x] + A[c + x] + A[b + xm] + A[b + xp] - 4 * u) - q + F * (1 - u);
              V2[i] = v + dv * (V[a + x] + V[c + x] + V[b + xm] + V[b + xp] - 4 * v) + q - (F + K) * v;
            }
          }
          let z = A; A = A2; A2 = z;
          z = V; V = V2; V2 = z;
        }
        for (let i = 0; i < n; i++) f[i] = -V[i] + r() * 1e-5;
      } else {
        const D = S.diam;
        const sp = S.space;
        const cols = Math.max(1, Math.round(w / sp));
        const rows = Math.max(1, Math.round(h / sp));
        const cs = [];
        for (let j = 0; j < rows; j++) {
          for (let i = 0; i < cols; i++) {
            cs.push({
              x: (i + 0.5 + (S.pmode === 'arcs' && (j % 2) ? 0.5 : 0) + (r() - 0.5) * 0.4) * w / cols,
              y: (j + 0.5 + (r() - 0.5) * 0.4) * h / rows,
              a: S.prand ? 1 + ((r() * S.arms) | 0) : S.arms,
              d: S.prand && r() < 0.5 ? -1 : 1
            });
          }
        }
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            let b = 1e9, bc = null, bx = 0, by = 0;
            for (const c of cs) {
              const dx = ((x - c.x + w * 1.5) % w) - w / 2;
              const dy = ((y - c.y + h * 1.5) % h) - h / 2;
              const q = dx * dx + dy * dy;
              if (q < b) { b = q; bc = c; bx = dx; by = dy; }
            }
            const rho = Math.sqrt(b) / (D / 2);
            const th = Math.atan2(by, bx);
            let v;
            if (S.pmode === 'spirals') {
              const ph = ((bc.a * th / TAU + bc.d * S.wind / 20 * rho) % 1 + 1) % 1;
              v = Math.abs(ph - 0.5) + rho * 0.5;
            } else {
              const da = Math.abs(((th / RAD + 90 + 540) % 360) - 180);
              const half = S.sweep / 2;
              v = rho + (da > half ? (da - half) / 180 * 1.2 : 0);
            }
            f[y * w + x] = v + r() * 1e-5;
          }
        }
      }
      const idx = Array.from({ length: n }, (_, i) => i).sort((a, b) => f[a] - f[b]);
      const T = new Float32Array(n);
      idx.forEach((i, j) => { T[i] = (j + 0.5) / n; });
      PM = T;
      return T;
    }

    const hex = c => [1, 3, 5].map(i => parseInt(c.slice(i, i + 2), 16));

    function patt(T, p, zw) {
      const t = pat();
      const sv = OF; OF = [[0, 0]];
      const w = S.pw;
      const h = S.ph;
      const sc = S.pscale / 10;
      const hd = S.hide / 100;
      const c = document.createElement('canvas');
      c.width = W;
      c.height = H;
      const x = c.getContext('2d');
      const id = x.createImageData(W, H);
      const o = id.data;
      const k = hex(p.c);
      const th = (S.prot + p.a) * RAD;
      const cs = Math.cos(th);
      const sn = Math.sin(th);
      const ns = S.noise / 100 * 0.35;

      for (let Y = 0; Y < H; Y++) {
        for (let X = 0; X < W; X++) {
          const q = (Y * W + X) * 4;
          const rawD = DD(p, X, Y);
          if (rawD <= hd) continue;
          const wgt = zw ? zw(rawD) : 1;
          if (wgt <= 0.005) continue;

          const d = fz(rawD) * wgt;
          const dx = X - W / 2 - p.ox;
          const dy = Y - H / 2 - p.oy;
          let u = Math.floor((dx * cs + dy * sn) / sc);
          let v = Math.floor((-dx * sn + dy * cs) / sc);
          if (S.pflip) u = -u;
          const ix = ((u % w) + w) % w;
          const iy = ((v % h) + h) % h;
          let tv = t[iy * w + ix];
          if (S.pinv) tv = 1 - tv;

          const hr = (Math.imul(u ^ (S.seed * 2654435761), 73856093) ^ Math.imul(v, 19349663)) >>> 0;
          const hq = hr / 4294967296;
          if (ns > 0) tv = Math.min(1, Math.max(0, tv + (hq - 0.5) * ns));

          let on = S.l2 && d > tv;
          if (S.l1 && d > 0.85 && hq < (d - 0.85) / 0.15 * 0.35) on = false;
          if (S.l3 && d > hd && d < 0.15 && hq < (0.15 - d) / 0.15 * 0.35) on = true;

          if (on) {
            o[q] = k[0];
            o[q + 1] = k[1];
            o[q + 2] = k[2];
            o[q + 3] = 255;
          }
        }
      }
      OF = sv;
      if (T.mask) T.mask(o);
      else { x.putImageData(id, 0, 0); T.raster(c, S.mode !== 'mono'); }
    }

    function renderScreen(T, p, r, g, zw) {
      if (g === 'dots-grid') dots(T, p, r, 0, zw);
      else if (g === 'dots-hex') dots(T, p, r, 1, zw);
      else if (g === 'lines') lines(T, p, r, p.a, d => d, 0, zw);
      else if (g === 'wavy') lines(T, p, r, p.a, d => d, 1, zw);
      else if (g === 'rings') rings(T, p, r, zw);
      else if (g === 'crosshatch') {
        lines(T, p, r, p.a, d => d, 0, zw);
        lines(T, p, r, p.a + 90, d => d < 0.5 ? -1 : (d - 0.5) * 2, 0, zw);
        lines(T, p, r, p.a + 45, d => d < 0.75 ? -1 : (d - 0.75) * 4, 0, zw);
      } else if (g === 'stochastic') {
        fm(T, p, r, zw);
      } else {
        patt(T, p, zw);
      }
    }

    const PN = { mono: ["Ink"], duo: ["Ink_1", "Ink_2"], cmyk: ["Cyan", "Magenta", "Yellow", "Black"] };
    function paint(T) {
      gw();
      const setSpread = sz => {
        const sp = S.spread / 100 * sz * 0.5;
        OF = sp > 0.3 ? [[0, 0], [sp, 0], [-sp, 0], [0, sp], [0, -sp]] : [[0, 0]];
      };
      T.bg(S.paper, W, H);

      let P = plates();
      P.forEach((p, i) => { p.n = PN[S.mode][i]; });
      if (S.mode === 'cmyk' && S.pv !== 'all') {
        P = [P['cmyk'.indexOf(S.pv)]];
      }

      P.forEach((p, i) => {
        p.ox = (i % 2 ? -1 : 1) * i * S.mis * 0.8;
        p.oy = (i % 2 ? 1 : -1) * i * S.mis * 0.5;
        T.begin(p.c, S.mode !== 'mono', p.n);

        if (!S.zsplit) {
          setSpread(S.size);
          const zp = Object.assign({}, p, { a: S.angle + p.da, s: S.size });
          renderScreen(T, zp, rng(S.seed * 31 + i), S.screen, null);
        } else {
          // Group tonal zones sharing identical style, cell size, and angle
          const zones = [
            { sc: S.scH, sz: S.szH, ang: S.angH, zi: 0 },
            { sc: S.scM, sz: S.szM, ang: S.angM, zi: 1 },
            { sc: S.scS, sz: S.szS, ang: S.angS, zi: 2 }
          ];
          const groups = new Map();
          zones.forEach(z => {
            const key = `${z.sc}|${z.sz}|${z.ang}`;
            if (!groups.has(key)) groups.set(key, { sc: z.sc, sz: z.sz, ang: z.ang, zis: [] });
            groups.get(key).zis.push(z.zi);
          });
          let idx = 0;
          for (const g of groups.values()) {
            setSpread(g.sz);
            const zp = Object.assign({}, p, { a: g.ang + p.da, s: g.sz });
            const zw = g.zis.length === 3
              ? null
              : d => {
                  const ws = zoneWeights(d);
                  let sum = 0;
                  for (const zi of g.zis) sum += ws[zi];
                  return sum;
                };
            renderScreen(T, zp, rng(S.seed * 31 + i * 7 + idx++), g.sc, zw);
          }
        }
        T.end();
      });
    }

    // Canvas & SVG vector render targets
    const f1 = n => n.toFixed(1);
    const canvasT = x => ({
      bg(c, w, h) { x.globalCompositeOperation = 'source-over'; x.fillStyle = c; x.fillRect(0, 0, w, h); },
      begin(c, m) { x.globalCompositeOperation = m ? 'multiply' : 'source-over'; x.fillStyle = c; x.beginPath(); },
      poly(p) { p.forEach((q, i) => i ? x.lineTo(q[0], q[1]) : x.moveTo(q[0], q[1])); x.closePath(); },
      circ(a, b, r, rev) { x.moveTo(a + r, b); x.arc(a, b, r, 0, TAU, !!rev); },
      end() { x.fill(); x.globalCompositeOperation = 'source-over'; },
      raster(c, m) {
        x.globalCompositeOperation = m ? 'multiply' : 'source-over';
        x.imageSmoothingEnabled = false;
        x.drawImage(c, 0, 0, W, H);
        x.globalCompositeOperation = 'source-over';
      }
    });

    const f2 = n => (+n.toFixed(2)).toString();
    const svgT = () => {
      const o = [];
      let d, dm, c, m, nm;
      const esc = t => String(t).replace(/[^A-Za-z0-9_-]/g, '_');
      return {
        bg(k, w, h) { if (X.paper) o.push(`<g id="Paper"><rect width="${w}" height="${h}" fill="${k}"/></g>`); },
        begin(k, mu, n) { d = []; dm = []; c = k; m = mu && X.mul; nm = n || 'Ink'; },
        poly(p) { d.push('M' + p.map(q => f1(q[0]) + ' ' + f1(q[1])).join('L') + 'Z'); },
        circ(a, b, r, rev) {
          const w = rev ? 1 : 0;
          d.push(`M${f2(a + r)} ${f2(b)}A${f2(r)} ${f2(r)} 0 1 ${w} ${f2(a - r)} ${f2(b)}A${f2(r)} ${f2(r)} 0 1 ${w} ${f2(a + r)} ${f2(b)}Z`);
        },
        mask(px) {
          for (let y = 0; y < H; y++) {
            const row = y * W * 4;
            let x = 0;
            while (x < W) {
              if (px[row + x * 4 + 3]) {
                const s0 = x;
                while (x < W && px[row + x * 4 + 3]) x++;
                dm.push(`M${s0} ${y}h${x - s0}v1h${s0 - x}z`);
              } else x++;
            }
          }
        },
        end() {
          if (!d.length && !dm.length) return;
          o.push(`<g id="${esc(nm)}" fill="${c}"${m ? ' style="mix-blend-mode:multiply"' : ''}>` +
            (d.length ? `<path d="${d.join('')}"/>` : '') +
            (dm.length ? `<path shape-rendering="crispEdges" d="${dm.join('')}"/>` : '') + '</g>');
        },
        raster() {},
        out() {
          return `<?xml version="1.0" encoding="UTF-8"?>\n<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" style="isolation:isolate"><title>StephToneV1.1</title><desc>${S.zsplit ? 'tonal zones' : S.screen}, ${S.mode}, seed ${S.seed}</desc>${o.join('')}</svg>`;
        }
      };
    };

    const cv = $('#cv');
    let raf = 0;

    function draw() {
      if (!D_) return;
      const q = Math.min(2, devicePixelRatio || 1);
      const x = cv.getContext('2d');
      cv.width = W * q;
      cv.height = H * q;
      x.setTransform(q, 0, 0, q, 0, 0);
      paint(canvasT(x));
    }

    function go() {
      if (!raf) raf = requestAnimationFrame(() => { raf = 0; draw(); });
    }

    const X = { scale: 2, paper: true, mul: true };
    function xsync() {
      document.querySelectorAll('[data-xs]').forEach(b => b.classList.toggle('on', +b.dataset.xs === X.scale));
      $('#xp').classList.toggle('on', X.paper);
      $('#xm').classList.toggle('on', X.mul);
    }
    async function save(name, data, label) {
      const msg = $('#msg');
      let dl = null;
      try { dl = window.claude && await claude.use('downloads'); } catch (e) { dl = null; }
      if (dl) {
        try { await dl.save({ filename: name, data }); msg.textContent = label + ' ready: ' + name; return; }
        catch (e) {
          const code = e && e.code;
          if (code === 'declined') { msg.textContent = 'Export cancelled.'; return; }
          if (['rate_limited', 'too_large', 'bad_request', 'rejected_extension'].includes(code)) { msg.textContent = label + ' export failed (' + code + ').'; return; }
        }
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(data);
      a.download = name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 5000);
      msg.textContent = label + ' downloaded: ' + name;
    }
    const fname = ext => `StephToneV1.1-${S.zsplit ? 'zones' : S.screen}-${S.mode}.${ext}`;
    $('#png').onclick = () => {
      $('#msg').textContent = 'Rendering PNG…';
      setTimeout(() => {
        const k = X.scale, c = document.createElement('canvas');
        c.width = W * k; c.height = H * k;
        const x = c.getContext('2d'); x.scale(k, k);
        paint(canvasT(x));
        c.toBlob(b => b ? save(fname('png'), b, 'PNG') : ($('#msg').textContent = 'PNG failed: too large. Lower the scale.'), 'image/png');
      }, 30);
    };
    $('#svg').onclick = () => {
      $('#msg').textContent = 'Building SVG…';
      setTimeout(() => {
        try {
          const t = svgT(); paint(t);
          const svg = t.out();
          save(fname('svg'), new Blob([svg], { type: 'image/svg+xml' }), 'SVG ' + (svg.length / 1048576).toFixed(1) + ' MB');
        } catch (e) { $('#msg').textContent = 'SVG failed: ' + e.message; }
      }, 30);
    };
    document.querySelectorAll('[data-xs]').forEach(b => { b.onclick = () => { X.scale = +b.dataset.xs; xsync(); }; });
    $('#xp').onclick = () => { X.paper = !X.paper; xsync(); };
    $('#xm').onclick = () => { X.mul = !X.mul; xsync(); };
    $('#rst').onclick = () => { Object.assign(S, DEF, { inks: DEF.inks.slice() }); clrPre(); prep(); sync(); go(); };

    xsync();

    function loadDefault() {
      const im = new Image();
      im.onload = () => { SRC = { el: im, w: im.naturalWidth, h: im.naturalHeight }; prep(); sync(); go(); };
      im.onerror = () => { sample(0); prep(); sync(); go(); };
      im.src = DEFAULT_IMG;
    }
    $('#dfl').onclick = loadDefault;
    loadDefault();
    sync();
  </script>
